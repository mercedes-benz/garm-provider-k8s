# SPDX-License-Identifier: MIT
version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - goconst
    - gocritic
    - gocyclo
    - godox
    - govet
    - gosec
    - importas
    - ineffassign
    - loggercheck
    - misspell
    - nakedret
    - nilerr
    - predeclared
    - promlinter
    - revive
    - staticcheck
    - tagliatelle
    - unconvert
    - unused
    - wastedassign
    - whitespace
  settings:
    importas:
      no-unaliased: false
      alias:
        - pkg: k8s.io/api/core/v1
          alias: corev1
        - pkg: k8s.io/apimachinery/pkg/apis/meta/v1
          alias: metav1
    loggercheck:
      klog: true
      zap: false
      require-string-key: true
      no-printf-like: true
  exclusions:
    rules:
      - linters:
          - goconst
        path: '.+_test\.go'
      - linters:
          - revive
        path: '.+\.go'
        # Exclude all Go files for the revive linter for now
        # enable it later after fixing existing issues

formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mercedes-benz/garm-provider-k8s
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/mercedes-benz/garm-provider-k8s)
