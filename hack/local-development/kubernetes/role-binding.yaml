# SPDX-License-Identifier: MIT

apiVersion: rbac.authorization.k8s.io/v1
# Grants the garm-server ServiceAccount pod access inside the runner namespace only.
kind: RoleBinding
metadata:
  name: garm-provider-k8s
  namespace: runner
subjects:
  - kind: ServiceAccount
    namespace: garm-server
    name: garm-server
roleRef:
  kind: Role
  name: garm-provider-k8s
  apiGroup: rbac.authorization.k8s.io
